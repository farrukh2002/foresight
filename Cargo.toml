[package]
name = "foresight"
version = "0.6.0-beta"
edition = "2024"

[dependencies]
inotify = { version = "0.11.5", default-features = false }
parking_lot = "0.12"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
toml_edit = "0.25"

[features]
bench = []

[profile.release]
opt-level = 3
lto = true
strip = true
